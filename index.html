<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="villa-kids-build" content="V40-DESKTOP-MARIA">
<title>Villa Kids Parque</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 22px calc(20px + env(safe-area-inset-bottom));background:#08a8cf;color:#fff;overflow:hidden;position:relative}.decor{position:fixed;inset:0;pointer-events:none;opacity:.12;color:#fff;font-size:56px}.decor span{position:absolute;filter:grayscale(1);font-family:Arial,sans-serif}.d1{left:6%;top:8%}.d2{right:7%;top:12%}.d3{left:5%;bottom:12%}.d4{right:8%;bottom:8%}.d5{left:10%;top:43%}.d6{right:10%;top:45%}.login{position:relative;z-index:2;width:min(430px,92vw);text-align:center}.logo{display:block;width:min(285px,72vw);height:auto;max-height:245px;object-fit:contain;margin:0 auto 6px;filter:drop-shadow(0 4px 8px rgba(0,67,112,.12))}h1{margin:0 0 6px;font-size:25px;line-height:1.15;color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(0,65,110,.15)}.subtitle{margin:0 0 22px;color:rgba(255,255,255,.92);font-size:15px;font-weight:500}.field{position:relative;margin:12px 0}.field input{display:block;width:100%;height:58px;border:0;border-radius:10px;background:#fff;color:#233044;padding:0 54px 0 52px;font-size:17px;box-shadow:0 5px 15px rgba(0,72,110,.10);appearance:none;-webkit-appearance:none}.field input:focus{outline:3px solid rgba(255,255,255,.32)}.ico{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:22px;color:#707780;pointer-events:none}.eye{position:absolute;right:8px;top:7px;width:46px;height:44px;border:0;background:transparent;color:#727982;font-size:22px;border-radius:9px}.enter{width:100%;height:58px;border:0;border-radius:10px;margin-top:12px;background:#064c9d;color:#fff;font-size:19px;font-weight:850;letter-spacing:.5px;box-shadow:0 7px 18px rgba(0,54,126,.22)}.enter:active{transform:translateY(1px)}.msg{min-height:22px;margin-top:10px;color:#fff;font-size:14px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.15)}.build{font-size:10px;color:rgba(255,255,255,.55);margin-top:12px}@media(max-height:700px){.logo{width:210px;max-height:160px}h1{font-size:21px;margin-bottom:12px}.field{margin:8px 0}.field input,.enter{height:50px}.eye{top:3px}}
</style>
</head><body>
<div class="decor" aria-hidden="true"><span class="d1">☆</span><span class="d2">☁</span><span class="d3">☆</span><span class="d4">○</span><span class="d5">♢</span><span class="d6">☆</span></div>
<form class="login" id="loginForm" autocomplete="on">
<img class="logo" src="villa-kids-logo-transparente.png?v=40" alt="Villa Kids Parque">
<h1>Villa Kids Parque Sistema</h1><div class="subtitle">Controle e gestão do espaço infantil</div>
<div class="field"><span class="ico">♙</span><input id="user" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Usuário" type="text"></div>
<div class="field"><span class="ico">▣</span><input id="pass" autocomplete="current-password" placeholder="Senha" type="password"><button class="eye" id="eye" type="button" aria-label="Mostrar senha">◉</button></div>
<button class="enter" type="submit">↪ &nbsp; ENTRAR</button><div class="msg" id="msg"></div><div class="build">V40</div>
</form>
<script>
(function(){
  const API='https://abfeofdqjphgrzvyfgxf.supabase.co/functions/v1/villa-api';
  const KEY='sb_publishable_AtKUUvS1UYvpspVdmQDDoQ_jU9wwkXU';
  var f=document.getElementById('loginForm'),u=document.getElementById('user'),p=document.getElementById('pass'),e=document.getElementById('eye'),m=document.getElementById('msg');
  e.onclick=function(){p.type=p.type==='password'?'text':'password';p.focus()};
  f.onsubmit=async function(ev){
    ev.preventDefault();var uu=(u.value||'').trim().toLowerCase(),pp=p.value||'';
    if(!uu||!pp){m.textContent='Digite usuário e senha.';return false}
    var btn=f.querySelector('.enter'),old=btn.textContent;btn.disabled=true;btn.textContent='ENTRANDO...';m.textContent='Conectando ao Villa Kids...';
    try{
      var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({action:'login',usuario:uu,password:pp})});
      var body=await r.json().catch(function(){return {}});
      if(!r.ok)throw new Error(body.error||'Usuário ou senha incorretos.');
      localStorage.setItem('villa_kids_cloud_token',body.token);
      if(body.user&&String(body.user.usuario||'').toLowerCase()==='admin')body.user.nome='Maria';
      localStorage.setItem('villa_kids_session',JSON.stringify(body.user));
      localStorage.setItem('villa_kids_show_welcome','1');
      location.replace('app.html?v=40');
    }catch(err){m.textContent=(err&&err.message)||'Não foi possível conectar. Verifique a internet.';btn.disabled=false;btn.textContent=old;}
    return false;
  };
})();
</script>
</body></html>
