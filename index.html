<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="villa-kids-build" content="V12-STANDALONE">
<title>Villa Kids Parque</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#eefcff 0%,#f8f4ff 48%,#fff6ed 100%);color:#172238}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(420px,94vw);background:#fff;border-radius:26px;padding:22px 24px 26px;box-shadow:0 18px 60px rgba(37,65,85,.16);text-align:center}.logo{display:block;width:190px;height:112px;object-fit:contain;margin:0 auto 2px}h1{margin:2px 0 8px;color:#f05a18;font-size:24px}.sub{margin:0 0 16px;color:#687386;font-size:14px}input{display:block;width:100%;height:52px;border:1px solid #d7dee7;border-radius:14px;background:#fff;color:#172238;padding:0 14px;font-size:16px;margin:8px 0;appearance:none;-webkit-appearance:none}input:focus{outline:none;border-color:#10a7b3;box-shadow:0 0 0 3px rgba(16,167,179,.12)}.pass{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:8px;align-items:center}.eye{height:52px;border:0;border-radius:14px;background:#ef4d88;color:#fff;font-size:20px}.enter{width:100%;height:52px;border:0;border-radius:14px;margin-top:10px;background:linear-gradient(90deg,#10a7b3,#78ad27,#f6b719,#f05a18);color:#fff;font-size:17px;font-weight:800}.msg{min-height:20px;margin-top:8px;color:#bd2e42;font-size:13px}.build{font-size:10px;color:#a5adb8;margin-top:8px}
</style>
</head><body>
<form class="card" id="loginForm" autocomplete="on">
<img class="logo" src="villa-kids-logo.jpg?v=12" alt="Villa Kids Parque">
<h1>Villa Kids Parque Sistema</h1><p class="sub">Controle e gestão do espaço infantil</p>
<input id="user" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Usuário" type="text">
<div class="pass"><input id="pass" autocomplete="current-password" placeholder="Senha" type="password"><button class="eye" id="eye" type="button" aria-label="Mostrar senha">👁</button></div>
<button class="enter" type="submit">Entrar</button><div class="msg" id="msg"></div><div class="build">V12</div>
</form>
<script>
(function(){
 var f=document.getElementById('loginForm'),u=document.getElementById('user'),p=document.getElementById('pass'),e=document.getElementById('eye'),m=document.getElementById('msg');
 e.onclick=function(){p.type=p.type==='password'?'text':'password';p.focus()};
 f.onsubmit=function(ev){ev.preventDefault();var uu=(u.value||'').trim().toLowerCase(),pp=p.value||'';if(!uu||!pp){m.textContent='Digite usuário e senha.';return false}if(uu!=='admin'||pp!=='1234'){m.textContent='Usuário ou senha incorretos.';return false}try{localStorage.setItem('villa_kids_session',JSON.stringify({usuario:'admin',nome:'Proprietária',role:'admin',tratamento:'tia'}));location.replace('app.html?v=12')}catch(err){m.textContent='Não foi possível iniciar a sessão.'}return false};
})();
</script>
</body></html>
